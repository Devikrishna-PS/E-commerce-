<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Manage Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="admin.html">

                ShopEase Admin

            </a>

            <a href="admin.html"
               class="btn btn-outline-light">

                Dashboard

            </a>

        </div>

    </nav>


    <section class="container my-5">

        <h1 class="mb-4">
            Product Management
        </h1>


        <div id="message"></div>


        <!-- Add Product -->

        <div class="card shadow-sm mb-5">

            <div class="card-body">

                <h4 class="mb-4">
                    Add New Product
                </h4>


                <form id="productForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   id="name"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   id="price"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Stock
                            </label>

                            <input type="number"
                                   id="stock"
                                   class="form-control"
                                   min="0"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Image URL
                            </label>

                            <input type="text"
                                   id="imageUrl"
                                   class="form-control">

                        </div>


                        <div class="col-12 mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea id="description"
                                      class="form-control"
                                      rows="3"
                                      required></textarea>

                        </div>


                        <div class="col-12 mb-3">

                            <label class="form-label">
                                Category ID
                            </label>

                            <input type="number"
                                   id="categoryId"
                                   class="form-control"
                                   min="1"
                                   required>

                            <small class="text-muted">
                                1 = Electronics,
                                2 = Fashion,
                                3 = Books,
                                4 = Beauty,
                                5 = Home & Kitchen
                            </small>

                        </div>


                    </div>


                    <button type="submit"
                            class="btn btn-dark">

                        Add Product

                    </button>

                </form>

            </div>

        </div>


        <!-- Existing Products -->

        <h3 class="mb-3">
            Existing Products
        </h3>

        <div id="productContainer"
             class="row">

        </div>

    </section>


    <script src="js/admin-products.js"></script>

</body>

</html>
